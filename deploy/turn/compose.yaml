# Optional, separate stack. Never changes the avid project's existing volumes.
name: avid-turn
services:
  turn:
    image: ${COTURN_IMAGE:-quay.io/coturn/coturn:4.18.0-r0}
    user: "65534:65534"
    init: true
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    # Required by the official binary's file capability, even on port 3478.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777,size=16m
    volumes:
      - ./private/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
