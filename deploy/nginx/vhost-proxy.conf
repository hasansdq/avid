# ---------------------------------------------------------------------------
# آوید — snippet برای nginx (وقتی دایرکت‌ادمین در حالت nginx_apache است:
# nginx جلو است و Apache پشت آن؛ یا nginx خالص)
#
# محل نصب: در server{} دامنه (از طریق Custom HTTPD یا فایل include دامنه)
# ---------------------------------------------------------------------------
location /socket.io/ {
    proxy_pass http://127.0.0.1:3004/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location / {
    proxy_pass http://127.0.0.1:3900;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 256m;
}
