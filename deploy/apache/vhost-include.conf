# ---------------------------------------------------------------------------
# آوید — تنظیمات VirtualHost آپاچی برای دایرکت‌ادمین (DirectAdmin)
#
# محل نصب: Admin Level → Custom HTTPD Configurations → انتخاب دامنه →
# در بخش «Customized Tokens for VirtualHost» وارد کنید (این فایل INCLUDE
# داخل <VirtualHost> است — نه جایگزین کامل آن).
# مسیر فایل روی سرور: /usr/local/directadmin/data/users/<user>/domains/<domain>.cust/custom2.conf
# (راه ساده‌تر: از پنل، محتوای همین فایل را در textarea مربوط به VirtualHost بچسبانید)
#
# ماژول‌های لازم (در CustomBuild فعال کنید):
#   ./build set apache_modules "mod_proxy mod_proxy_http mod_proxy_wstunnel mod_rewrite mod_headers"
#   ./build rewrite_confs
#
# پورت‌های سرویس‌ها (از compose.yaml):
#   وب:   127.0.0.1:3900   —   چت: 127.0.0.1:3004 (مسیر /socket.io/)
# ---------------------------------------------------------------------------

# — پروکسی معکوس فعال —
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 300
TimeOut 300
AllowEncodedSlashes NoDecode

# ———— سرویس چت: /socket.io/ — WebSocket و HTTP polling ————
# درخواست‌های WebSocket (Upgrade: websocket) به پروتکل ws می‌روند؛
# بقیه (polling/long-polling) با HTTP عادی پروکسی می‌شوند.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/socket\.io/(.*)$ ws://127.0.0.1:3004/socket.io/$1 [P,L]
RewriteCond %{REQUEST_URI} ^/socket\.io/
RewriteRule ^/socket\.io/(.*)$ http://127.0.0.1:3004/socket.io/$1 [P,L]

ProxyPass        /socket.io/ http://127.0.0.1:3004/socket.io/ retry=0
ProxyPassReverse /socket.io/ http://127.0.0.1:3004/socket.io/

# ———— اپلیکیشن Next.js — همه‌ی مسیرهای دیگر ————
ProxyPass        / http://127.0.0.1:3900/ retry=0
ProxyPassReverse / http://127.0.0.1:3900/

# هدرهای استاندارد پروکسی — برای کوکی‌های Secure و callback درگاه پرداخت
RequestHeader setifempty X-Forwarded-Proto "https"
RequestHeader setifempty X-Forwarded-Port "443"

# فایل‌های استاتیک/آپلود بزرگ — محدودیت بدنه برای آپلود ویدئو (تا ۲۵۶MB)
LimitRequestBody 268435456
