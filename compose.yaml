# ---------------------------------------------------------------------------
# آوید — استقرار با Docker Compose (وب + سرویس چت + سرویس مهاجرت)
#
#   docker compose up -d --build     اولین بار / بعد از تغییر سورس
#
# پورت‌های میزبان فقط روی 127.0.0.1 بسته می‌شوند؛ دامنه از طریق
# Apache/nginx دایرکت‌ادمین (تنظیم deploy/) به این پورت‌ها پروکسی می‌شود.
# متغیرهای عمومی (پورت‌ها، رمز مدیر اولیه و…) از فایل .env خوانده می‌شوند.
# ---------------------------------------------------------------------------
name: avid

services:
  # — مهاجرت غیرمخرب + بوت‌استرپ مدیر (یک‌بار در هر up؛ سریع و idempotent)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    restart: "no"
    environment:
      DATABASE_URL: file:/app/data/custom.db
      TZ: ${TZ:-Asia/Tehran}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # خالی = رمز تصادفی ساخته و در لاگ سرویس migrate چاپ می‌شود (نصب تازه)
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_FORCE_RESET: ${ADMIN_FORCE_RESET:-0}
      BACKUP_DIR: /app/backups
    volumes:
      - avid_db:/app/data
      - avid_backups:/app/backups
      - avid_uploads:/app/uploads:ro
    # migrate.ts: نصب تازه (در نبود فایل دیتابیس، یک فایل SQLite خالی
    # ساخته می‌شود تا موتور مهاجرت با «Schema engine error» رد نشود —
    # همان راه‌حل تأییدشده روی VPS؛ سپس migrate deploy) یا دیتابیس
    # موجود — «آشتی‌سازی» مهاجرت‌ها (بکاپ → شفا‌ی افزایشی → بازپخش
    # مهاجرت‌های ثبت‌نشده با تحملِ «هم‌اکنون موجود» → ثبت تاریخچه —
    # بدون prisma db push و بدون از دست رفتن داده)؛ سپس bootstrap مدیر.
    command: sh -c "bun scripts/migrate.ts && bun scripts/bootstrap.ts"

  # — اپ Next.js (standalone) — پورت میزبان فقط لوکال
  # (وب روی 127.0.0.1:3900 → 3000 کانتینر؛ پروکسی دایرکت‌ادمین به همین پورت)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3900}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/custom.db
      TZ: ${TZ:-Asia/Tehran}
      # مبدای رسمی سایت (بند ۱۰) — آدرس بازگشت درگاه پرداخت از همین مقدار
      # ساخته می‌شود و دیگر به هدرهای قابل‌جعل درخواست متکی نیست؛ خالی =
      # هدرهای پروکسی (رفتار پیشین).
      SITE_URL: ${SITE_URL:-}
      STREAM_STUN_URLS: ${STREAM_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      STREAM_TURN_URLS: ${STREAM_TURN_URLS:-}
      STREAM_TURN_SECRET: ${STREAM_TURN_SECRET:-}
      STREAM_TURN_TTL_SECONDS: ${STREAM_TURN_TTL_SECONDS:-3600}
      STREAM_ICE_TRANSPORT_POLICY: ${STREAM_ICE_TRANSPORT_POLICY:-all}
      # مبداهای اضافه‌ی مجاز (CSRF/سوکت) — جداشده با ویرگول؛ خالی = فقط هم‌مبدأ
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # رمز مشترک امضای تیکت‌های عضویت چت (باید با سرویس chat یکی باشد)
      # — بدون مقدار، compose با پیام خطا متوقف می‌شود (کلید ثابتی وجود ندارد)
      CHAT_AUTH_SECRET: ${CHAT_AUTH_SECRET:?CHAT_AUTH_SECRET is required — set it in .env (openssl rand -hex 32)}
      # امضای لینک‌های خصوصی گواهینامه (اختیاری — پیش‌فرض همان CHAT_AUTH_SECRET)
      FILE_SIGN_SECRET: ${FILE_SIGN_SECRET:-}
      # نمایش کد تایید وقتی پیامک واقعی پیکربندی نشده — فقط محیط توسعه؛
      # در production این کد هرگز در پاسخ API برگردانده نمی‌شود
      OTP_DEV_CODE: ${OTP_DEV_CODE:-0}
    volumes:
      - avid_db:/app/data
      - avid_uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "/app/scripts/healthcheck.ts", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
      # /api/health با خطای دیتابیس 503 برمی‌گرداند → کانتینر «unhealthy»

  # — سرویس رله‌ی چت Socket.IO — پورت میزبان فقط لوکال
  chat:
    build:
      context: ./mini-services/chat-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHAT_PORT:-3004}:3004"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/custom.db
      TZ: ${TZ:-Asia/Tehran}
      # مبداهای مجاز اتصال سوکت (بند ۷) — خالی = فقط هم‌مبدأ با Host درخواست
      SITE_URL: ${SITE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CHAT_AUTH_SECRET: ${CHAT_AUTH_SECRET:?CHAT_AUTH_SECRET is required — set it in .env (openssl rand -hex 32)}
    volumes:
      - avid_db:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "/app/healthcheck.ts", "http://127.0.0.1:3004/socket.io/?EIO=4&transport=polling"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # — سرویس کلاس آنلاین (استریم): سیگنالینگ WebRTC + اتاق چت — لوکال
  # (روی 127.0.0.1:3005؛ پروکسی دایرکت‌ادمین از /stream-socket/ به همین پورت)
  stream:
    build:
      context: ./mini-services/stream-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STREAM_PORT:-3005}:3005"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/custom.db
      TZ: ${TZ:-Asia/Tehran}
      # مبداهای مجاز اتصال سوکت (بند ۷) — خالی = فقط هم‌مبدأ با Host درخواست
      SITE_URL: ${SITE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - avid_db:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "/app/healthcheck.ts", "http://127.0.0.1:3005/stream-socket/?EIO=4&transport=polling"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  # دیتابیس SQLite — فضای دائمی (بکاپ: deploy/backup.sh)
  avid_db:
  # فایل‌های آپلودی — فضای دائمی (اولین بار با فایل‌های نمونه پر می‌شود)
  avid_uploads:
  # پشتیبان‌ها
  avid_backups:
